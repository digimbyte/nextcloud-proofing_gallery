name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "47 1 * * 4"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      web: ${{ steps.classify.outputs.web }}
      php: ${{ steps.classify.outputs.php }}
      workflow: ${{ steps.classify.outputs.workflow }}
      docs: ${{ steps.classify.outputs.docs }}
      dependencies: ${{ steps.classify.outputs.dependencies }}
      integration: ${{ steps.classify.outputs.integration }}
      compatibility: ${{ steps.classify.outputs.compatibility }}
      upgrade: ${{ steps.classify.outputs.upgrade }}
      codeql: ${{ steps.classify.outputs.codeql }}
      browser: ${{ steps.classify.outputs.browser }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "schedule" ] || [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            git ls-files | node scripts/classify-ci-changes.mjs --
          else
            git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" | node scripts/classify-ci-changes.mjs --
          fi

  workflow:
    needs: classify
    if: needs.classify.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - name: Parse every workflow as YAML
        run: node scripts/check-workflows.mjs

  docs:
    needs: classify
    if: github.event_name == 'pull_request' && needs.classify.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - run: npm run check:docs
      - run: npm run build:docs

  web:
    needs: classify
    if: needs.classify.outputs.web == 'true' && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run build:docs
      - if: needs.classify.outputs.dependencies == 'true'
        run: npm audit --audit-level=high
      - name: Upload frontend build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-frontend-build-${{ github.run_id }}
          path: |
            css
            js
          if-no-files-found: error
          retention-days: 1

  main_web_smoke:
    name: main web smoke
    needs: classify
    if: github.event_name == 'push' && needs.classify.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - if: needs.classify.outputs.dependencies == 'true'
        run: npm audit --audit-level=high
      - name: Upload frontend build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-frontend-build-${{ github.run_id }}
          path: |
            css
            js
          if-no-files-found: error
          retention-days: 1

  php:
    needs: classify
    if: needs.classify.outputs.php == 'true' && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        php: ["8.1", "8.6"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-php
        with:
          php-version: ${{ matrix.php }}
      - run: composer lint
      - run: composer test
      - run: composer analyse
      - if: needs.classify.outputs.dependencies == 'true'
        run: composer audit --locked --no-interaction

  main_php_smoke:
    name: main PHP smoke
    needs: classify
    if: github.event_name == 'push' && needs.classify.outputs.php == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-php
        with:
          php-version: "8.4"
      - run: composer lint
      - run: composer test
      - run: composer analyse
      - if: needs.classify.outputs.dependencies == 'true'
        run: composer audit --locked --no-interaction

  dependency-review:
    needs: classify
    if: github.event_name == 'pull_request' && needs.classify.outputs.dependencies == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  secret-scan:
    needs: classify
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan only commits introduced by this pull request
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          docker run --rm
          -v "${{ github.workspace }}:/repo:ro"
          ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git --redact --no-banner --log-opts="${BASE_SHA}..${HEAD_SHA}" /repo

  secret-history:
    needs: classify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan complete public history
        run: >-
          docker run --rm
          -v "${{ github.workspace }}:/repo:ro"
          ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git --redact --no-banner /repo

  codeql:
    needs: classify
    if: needs.classify.outputs.codeql == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: javascript-typescript,actions
      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1

  e2e:
    needs: [classify, web, php, main_web_smoke, main_php_smoke]
    if: >-
      always() && github.event_name != 'push' &&
      (needs.classify.outputs.integration == 'true' || needs.classify.outputs.browser == 'true') &&
      needs.web.result == 'success' &&
      (needs.php.result == 'success' || needs.php.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - suite: ui
            specs: tests/e2e/collection.spec.ts tests/e2e/event.spec.ts tests/e2e/gallery.spec.ts tests/e2e/review-viewer.spec.ts
          - suite: api
            specs: tests/e2e/ecosystem.spec.ts tests/e2e/regression.spec.ts tests/e2e/security.spec.ts tests/e2e/review-identity.spec.ts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - name: Download frontend build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-frontend-build-${{ github.run_id }}
          path: .
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: Install browsers and runner dependencies
        run: |
          if ! timeout --kill-after=30s 5m npx playwright install --with-deps chromium firefox webkit; then
            echo "::warning::System dependency installation stalled; using runner-provided browser libraries."
            npx playwright install chromium firefox webkit
          fi
      - run: make dev-up
      - run: make occ CMD="app:list --enabled --output=json" | grep -q '"proofing_gallery"'
      - name: Run ${{ matrix.suite }} browser suite
        run: npm run test:e2e -- ${{ matrix.specs }}
      - name: Verify Context Agent and user-migration contracts
        if: matrix.suite == 'api'
        run: |
          ./scripts/test-context-agent.sh
          ./scripts/test-user-migration.sh
          docker compose exec -T --user www-data nextcloud php /var/www/html/custom_apps/proofing_gallery/tests/smoke/CollaborationSelectionSync.php
      - name: Verify protected public routes
        if: matrix.suite == 'api'
        env:
          E2E_SECURITY_PROTECTIONS: "1"
        run: npm run test:e2e -- --grep "public routes reject|Live Push credentials"
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-diagnostics-${{ matrix.suite }}-${{ github.run_attempt }}
          path: |
            test-results
            playwright-report
          if-no-files-found: warn
          retention-days: 7
      - if: always()
        run: docker compose down --volumes --remove-orphans

  compatibility:
    needs: [classify, web, php, main_web_smoke, main_php_smoke]
    if: >-
      always() && needs.classify.outputs.compatibility == 'true' &&
      ((github.event_name == 'push' && needs.main_web_smoke.result == 'success' && needs.main_php_smoke.result == 'success') ||
      (github.event_name != 'push' && needs.web.result == 'success' && needs.php.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        nextcloud: ["31", "32", "33", "34"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - name: Download frontend build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-frontend-build-${{ github.run_id }}
          path: .
      - env:
          NEXTCLOUD_VERSIONS: ${{ matrix.nextcloud }}
          DATABASES: sqlite
        run: ./scripts/compatibility-matrix.sh

  package:
    name: build upgrade package
    needs: [classify, web, php, main_web_smoke, main_php_smoke]
    outputs:
      use_release_baseline: ${{ steps.release_baseline.outputs.use }}
    if: >-
      always() && needs.classify.outputs.upgrade == 'true' &&
      ((github.event_name == 'push' && needs.main_web_smoke.result == 'success' && needs.main_php_smoke.result == 'success') ||
      (github.event_name != 'push' && needs.web.result == 'success' && needs.php.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/setup-php
        with:
          php-version: "8.4"
      - id: release_baseline
        run: |
          # shellcheck disable=SC2016
          version="$(php -r '$xml=simplexml_load_file("appinfo/info.xml"); echo (string)$xml->version;')"
          if test "${version}" != "0.7.0"; then echo "use=true" >> "${GITHUB_OUTPUT}"; else echo "use=false" >> "${GITHUB_OUTPUT}"; fi
      - run: make appstore
      - name: Validate package archive
        run: ./scripts/validate-appstore-package.sh build/artifacts/appstore/proofing_gallery.tar.gz
      - name: Verify package installation
        env:
          APPSTORE_ARCHIVE: ${{ github.workspace }}/build/artifacts/appstore/proofing_gallery.tar.gz
        run: ./scripts/verify-appstore-package.sh
      - name: Upload upgrade package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-upgrade-package-${{ github.run_id }}
          path: build/artifacts/appstore/proofing_gallery.tar.gz
          if-no-files-found: error
          retention-days: 1

  upgrade:
    needs: [classify, package]
    if: always() && needs.classify.outputs.upgrade == 'true' && needs.package.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        database: [sqlite, mariadb, postgres]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download upgrade package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-upgrade-package-${{ github.run_id }}
          path: build/artifacts/appstore
      - run: make test-upgrade
        env:
          UPGRADE_DATABASE: ${{ matrix.database }}
          UPGRADE_CURRENT_ARCHIVE: ${{ github.workspace }}/build/artifacts/appstore/proofing_gallery.tar.gz
          UPGRADE_FROM_ARCHIVE_URL: ${{ needs.package.outputs.use_release_baseline == 'true' && 'https://github.com/soerennb/nextcloud-proofing_gallery/releases/download/v0.7.0/proofing_gallery.tar.gz' || '' }}
          UPGRADE_FROM_CHECKSUMS_URL: ${{ needs.package.outputs.use_release_baseline == 'true' && 'https://github.com/soerennb/nextcloud-proofing_gallery/releases/download/v0.7.0/SHA256SUMS' || '' }}

  ci-gate:
    name: CI Gate
    if: always()
    needs: [classify, workflow, docs, web, main_web_smoke, php, main_php_smoke, dependency-review, secret-scan, secret-history, codeql, e2e, compatibility, package, upgrade]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          EVENT_NAME: ${{ github.event_name }}
          EXPECT_WORKFLOW: ${{ needs.classify.outputs.workflow }}
          EXPECT_DOCS: ${{ github.event_name == 'pull_request' && needs.classify.outputs.docs == 'true' }}
          EXPECT_WEB: ${{ needs.classify.outputs.web }}
          EXPECT_PHP: ${{ needs.classify.outputs.php }}
          EXPECT_DEPENDENCY_REVIEW: ${{ github.event_name == 'pull_request' && needs.classify.outputs.dependencies == 'true' }}
          EXPECT_SECRET_SCAN: ${{ github.event_name == 'pull_request' }}
          EXPECT_SECRET_HISTORY: ${{ github.event_name != 'pull_request' }}
          EXPECT_CODEQL: ${{ needs.classify.outputs.codeql }}
          EXPECT_E2E: ${{ github.event_name != 'push' && (needs.classify.outputs.integration == 'true' || needs.classify.outputs.browser == 'true') }}
          EXPECT_COMPATIBILITY: ${{ needs.classify.outputs.compatibility }}
          EXPECT_PACKAGE: ${{ needs.classify.outputs.upgrade }}
          EXPECT_UPGRADE: ${{ needs.classify.outputs.upgrade }}
          WORKFLOW_RESULT: ${{ needs.workflow.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
          WEB_RESULT: ${{ needs.web.result }}
          MAIN_WEB_RESULT: ${{ needs.main_web_smoke.result }}
          PHP_RESULT: ${{ needs.php.result }}
          MAIN_PHP_RESULT: ${{ needs.main_php_smoke.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
          SECRET_SCAN_RESULT: ${{ needs.secret-scan.result }}
          SECRET_HISTORY_RESULT: ${{ needs.secret-history.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          COMPATIBILITY_RESULT: ${{ needs.compatibility.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          UPGRADE_RESULT: ${{ needs.upgrade.result }}
        run: |
          set -euo pipefail
          for result in ${RESULTS}; do
            case "${result}" in
              success|skipped) ;;
              *) echo "A selected CI job did not succeed: ${result}" >&2; exit 1 ;;
            esac
          done

          require_success() {
            local name="$1"
            local expected="$2"
            local result="$3"
            if [[ "${expected}" == "true" && "${result}" != "success" ]]; then
              echo "Expected ${name} to succeed, but it was ${result}." >&2
              exit 1
            fi
          }

          require_success workflow "${EXPECT_WORKFLOW}" "${WORKFLOW_RESULT}"
          require_success docs "${EXPECT_DOCS}" "${DOCS_RESULT}"
          if [[ "${EVENT_NAME}" == "push" ]]; then
            require_success main_web_smoke "${EXPECT_WEB}" "${MAIN_WEB_RESULT}"
            require_success main_php_smoke "${EXPECT_PHP}" "${MAIN_PHP_RESULT}"
          else
            require_success web "${EXPECT_WEB}" "${WEB_RESULT}"
            require_success php "${EXPECT_PHP}" "${PHP_RESULT}"
          fi
          require_success dependency-review "${EXPECT_DEPENDENCY_REVIEW}" "${DEPENDENCY_REVIEW_RESULT}"
          require_success secret-scan "${EXPECT_SECRET_SCAN}" "${SECRET_SCAN_RESULT}"
          require_success secret-history "${EXPECT_SECRET_HISTORY}" "${SECRET_HISTORY_RESULT}"
          require_success codeql "${EXPECT_CODEQL}" "${CODEQL_RESULT}"
          require_success e2e "${EXPECT_E2E}" "${E2E_RESULT}"
          require_success compatibility "${EXPECT_COMPATIBILITY}" "${COMPATIBILITY_RESULT}"
          require_success package "${EXPECT_PACKAGE}" "${PACKAGE_RESULT}"
          require_success upgrade "${EXPECT_UPGRADE}" "${UPGRADE_RESULT}"
          echo "All selected CI checks passed."
